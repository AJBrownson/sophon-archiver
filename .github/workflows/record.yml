name: record-live

on:
  repository_dispatch:
    types: [record-live]

jobs:
  record:
    runs-on: ubuntu-latest
    # GitHub hosted runners hard-cap at 6 hours per job; leave a safety buffer
    timeout-minutes: 355
    steps:
      - name: Install yt-dlp, ffmpeg, awscli
        env:
          PIP_REQUIRE_VIRTUALENV: false
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp awscli
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Build safe filename
        id: meta
        run: |
          TITLE="${{ github.event.client_payload.title }}"
          SAFE_TITLE=$(echo "${TITLE:-live-recording}" | tr -c 'a-zA-Z0-9-_' '-' | cut -c1-60)
          FILENAME="${SAFE_TITLE}-$(date +%Y%m%d-%H%M%S).mp4"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          
      - name: Write cookies file
        run: echo "${{ secrets.YT_COOKIES }}" > cookies.txt
        
      - name: Capture live stream with periodic safety sync
        env:
          URL: ${{ github.event.client_payload.url }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FILENAME: ${{ steps.meta.outputs.filename }}
        run: |
          mkdir -p output
          RAW="output/recording.ts"
          SAFETY_KEY="in-progress/${FILENAME%.mp4}.ts"

          (
            while true; do
              sleep 300
              if [ -f "$RAW" ]; then
                aws s3 cp "$RAW" "s3://${R2_BUCKET}/${SAFETY_KEY}" --endpoint-url "$R2_ENDPOINT" || true
              fi
            done
          ) &
          SYNC_PID=$!

          # Prefer combined mp4 formats delivered over HLS (mpegts output grows
          # while recording, enabling the periodic safety sync above). Falls back
          # to any mp4, then anything.
          yt-dlp --no-part --no-playlist --cookies cookies.txt --hls-use-mpegts \
            --live-from-start --remote-components ejs:github \
            -f "best[ext=mp4][protocol^=m3u8]/best[ext=mp4]/best" \
            -o "$RAW" "$URL"
          YT_EXIT=$?

          kill "$SYNC_PID" 2>/dev/null || true

          if [ "$YT_EXIT" -eq 0 ] && [ -f "$RAW" ]; then
            ffmpeg -fflags +genpts -avoid_negative_ts make_zero -i "$RAW" \
              -c copy -movflags +faststart "output/recording.mp4"
            aws s3 cp "output/recording.mp4" "s3://${R2_BUCKET}/${FILENAME}" --endpoint-url "$R2_ENDPOINT"
            aws s3 rm "s3://${R2_BUCKET}/${SAFETY_KEY}" --endpoint-url "$R2_ENDPOINT" || true
          else
            aws s3 cp "$RAW" "s3://${R2_BUCKET}/${SAFETY_KEY}" --endpoint-url "$R2_ENDPOINT" || true
            exit 1
          fi
