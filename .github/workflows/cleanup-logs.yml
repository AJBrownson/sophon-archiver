name: cleanup-logs

on: 
  workflow_run:
    workflows: ["record-live"]
    types: [completed]

permissions:
  actions: write

jobs: 
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete logs for the completed run
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/logs)
          if [ "$STATUS" != "204" ]; then
            echo "Failed to delete logs (HTTP $STATUS)"
            exit 1
          fi
          echo "Logs deleted successfully"